# Configuration file for agent-cli-orchestrator

# Repository configuration
repository:
  name: "agent-cli-orchestrator"
  default_branch: "main"
  
# Server configuration
server:
  host: "0.0.0.0"
  port: 8000
  
# Copilot CLI configuration
copilot:
  enabled: true
  timeout: 300  # seconds
  
# Worktree configuration
worktrees:
  base_path: "./worktrees"