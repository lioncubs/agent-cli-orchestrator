[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=short
    -n auto
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-config=.coveragerc

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests